<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="no-photo-community-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AEBBD1"/>
      <stop offset="1" stop-color="#93A2B9"/>
    </linearGradient>
    <!-- pointy-top hexagon centred on 0,0 -->
    <path id="no-photo-community-hex" d="M0 -12.5L10.83 -6.25V6.25L0 12.5L-10.83 6.25V-6.25Z"/>
  </defs>
  <!-- default community picture: three blue-gray hexagons, two on top and one below -->
  <rect width="64" height="64" fill="#FFFFFF"/>
  <g fill="url(#no-photo-community-fill)" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round">
    <use href="#no-photo-community-hex" x="21.5" y="23"/>
    <use href="#no-photo-community-hex" x="42.5" y="23"/>
    <use href="#no-photo-community-hex" x="32" y="41"/>
  </g>
</svg>
